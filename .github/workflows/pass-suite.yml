name: Pass Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run pass suite tests
      run: npm run test:pass_suite
    - name: Archive test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: html-report-pass
        path: |
          reports/
          playwright-report/
